    .formbg {

    }

    }
    
    .reset-pass>a {

    }
    
    .grid--50-50 {
        display: grid;

    }
    
    .field input {
        font-size: 16px;
        line-height: 28px;
        padding: 8px 16px;
        width: 100%;
        min-height: 44px;
        border: unset;
        border-radius: 4px;
        outline-color: rgb(84 105 212 / 0.5);
        background-color: rgb(255, 255, 255);
        box-shadow: rgba(0, 0, 0, 0) 0px 0px 0px 0px, rgba(0, 0, 0, 0) 0px 0px 0px 0px, rgba(0, 0, 0, 0) 0px 0px 0px 0px, rgba(60, 66, 87, 0.16) 0px 0px 0px 1px, rgba(0, 0, 0, 0) 0px 0px 0px 0px, rgba(0, 0, 0, 0) 0px 0px 0px 0px, rgba(0, 0, 0, 0) 0px 0px 0px 0px;
    }
    
    input[type="submit"] {
        background-color: rgb(84, 105, 212);
        box-shadow: rgba(0, 0, 0, 0) 0px 0px 0px 0px, rgba(0, 0, 0, 0) 0px 0px 0px 0px, rgba(0, 0, 0, 0.12) 0px 1px 1px 0px, rgb(84, 105, 212) 0px 0px 0px 1px, rgba(0, 0, 0, 0) 0px 0px 0px 0px, rgba(0, 0, 0, 0) 0px 0px 0px 0px, rgba(60, 66, 87, 0.08) 0px 2px 5px 0px;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
    }
    
    .field-checkbox input {
        width: 20px;
        height: 15px;
        margin-right: 5px;
        box-shadow: unset;
        min-height: unset;
    }
    
    .field-checkbox label {
        display: flex;
        align-items: center;
        margin: 0;
    }
    
    a.ssolink {
        display: block;
        text-align: center;
        font-weight: 600;
    }
    
    .footer-link span {
        font-size: 14px;
        text-align: center;
    }
    
    .listing a {
        color: #697386;
        font-weight: 600;
        margin: 0 10px;
    }
    
    .animationRightLeft {
        animation: animationRightLeft 2s ease-in-out infinite;
    }
    
    .animationLeftRight {
        animation: animationLeftRight 2s ease-in-out infinite;
    }
    
    .tans3s {
        animation: animationLeftRight 3s ease-in-out infinite;
    }
    
    .tans4s {
        animation: animationLeftRight 4s ease-in-out infinite;
    }
    
    @keyframes animationLeftRight {
        0% {
            transform: translateX(0px);
        }
        50% {
            transform: translateX(1000px);
        }
        100% {
            transform: translateX(0px);
        }
    }
    
    @keyframes animationRightLeft {
        0% {
            transform: translateX(0px);
        }
        50% {
            transform: translateX(-1000px);
        }
        100% {
            transform: translateX(0px);
        }
    }
    
    .step {
        height: 15px;
        width: 15px;
        margin: 0 2px;
        background-color: #bbbbbb;
        border: none;
        border-radius: 50%;
        display: inline-block;
        opacity: 0.5;
    }
    /* Mark the active step: */
    
    .step.active {
        opacity: 1;
    }
    /* Mark the steps that are finished and valid: */
    
    .step.finish {
        background-color: #04AA6D;
    }
    /* Hide all steps by default: */
    
    .tab {
        display: none;
    }
    
    .avatar-wrapper {
        position: relative;
        height: 200px;
        width: 200px;
        /*margin: 20px auto;*/
        margin: -100px auto 20px auto;
        border-radius: 50%;
        overflow: hidden;
        /*box-shadow: 1px 1px 15px -5px black;*/
        box-shadow: none;
        transition: all .3s ease;
    }
    
    .avatar-wrapper:hover {
        transform: scale(1.05);
        cursor: pointer;
    }
    
    .avatar-wrapper:hover .profile-pic {
        opacity: .5;
    }
    
    .avatar-wrapper .profile-pic {
        height: 100%;
        width: 100%;
        transition: all .3s ease;
        object-fit: cover;
    }
    
    .avatar-wrapper .profile-pic:after {
        font-family: FontAwesome;
        content: "\f007";
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        position: absolute;
        font-size: 190px;
        background: #ecf0f1;
        color: #34495e;
        text-align: center;
    }
    
    .avatar-wrapper .upload-button {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
    }

        position: absolute;
        font-size: 243px;
        top: -16px;
        left: -5px;
        text-align: center;
        opacity: 0;
        transition: all .3s ease;

    }

    .drag-area img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
</style>

<script>
    var currentTab = 0; // Current tab is set to be the first tab (0)
    showTab(currentTab); // Display the current tab

    function showTab(n) {
        // This function will display the specified tab of the form ...
        var x = document.getElementsByClassName("tab");
        x[n].style.display = "block";
        // ... and fix the Previous/Next buttons:
        let id_username = document.getElementById('id_username').value;
        let id_email = document.getElementById('id_email').value;

        if (id_username && id_email) {
            document.querySelector('.id_username').innerText = id_username;
            document.querySelector('.id_email').innerText = id_email;
        } else {
            document.querySelector('.id_username').innerText = 'Données non renseignées';
            document.querySelector('.id_email').innerText = 'Données non renseignées';
        }

        if (n == 0) {
            document.getElementById("prevBtn").style.display = "none";
        } else {
            document.getElementById("prevBtn").style.display = "inline";
        }
        if (n == (x.length - 1)) {
            document.getElementById("nextBtn").innerHTML = "Enregister";
        } else {
            document.getElementById("nextBtn").innerHTML = "Next";
        }
        // ... and run a function that displays the correct step indicator:
        fixStepIndicator(n)
    }

    function nextPrev(n) {
        // This function will figure out which tab to display
        var x = document.getElementsByClassName("tab");

        // Exit the function if any field in the current tab is invalid:
        if (n == 1 && !validateForm()) return false;
        // Hide the current tab:
        x[currentTab].style.display = "none";
        // Increase or decrease the current tab by 1:
        currentTab = currentTab + n;
        // console.log(x);
        // console.log(x[currentTab]);
        // console.log(currentTab);
        // console.log(n);
        // if you have reached the end of the form... :
        if (currentTab >= x.length) {
            //...the form gets submitted:
            document.getElementById("stripe-login").submit();
            return false;
        }
        // Otherwise, display the correct tab:
        showTab(currentTab);
    }

    function validateForm() {
        // This function deals with validation of the form fields
        var x, y, i, valid = true;
        x = document.getElementsByClassName("tab");
        y = x[currentTab].getElementsByTagName("input");
        // A loop that checks every input field in the current tab:
        for (i = 0; i < y.length; i++) {
            // If a field is empty...

            if (y[i].value == "") {
                // add an "invalid" class to the field:
                y[i].className += " invalid";
                // and set the current valid status to false:
                valid = false;
                console.log(y[i]);
            }
        }
        // If the valid status is true, mark the step as finished and valid:
        if (valid) {
            document.getElementsByClassName("step")[currentTab].className += " finish";
        }
        return valid; // return the valid status
    }

    function fixStepIndicator(n) {
        // This function removes the "active" class of all steps...
        var i, x = document.getElementsByClassName("step");
        for (i = 0; i < x.length; i++) {
            x[i].className = x[i].className.replace(" active", "");
        }
        //... and adds the "active" class to the current step:
        x[n].className += " active";
    }
</script>
